<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Ultra Hotel</title>
<meta name="description" content="That page could not be found. Find a hotel, browse the collection, or start a booking with Ultra Hotel Group.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1A1A1A">
<link rel="canonical" href="https://www.ultrahotel.com/404.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/pages.css">
<link rel="stylesheet" href="/assets/css/motion.css">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
</head>

<body data-page="notfound" data-bookingbar="false" data-nav="solid">

<div data-nav-mount></div>

<main id="main">

  <section class="section section--dark feature">
    <div class="feature__media" data-parallax-host>
      <img src="https://images.unsplash.com/photo-1502005229762-cf1b2da7c5d6?auto=format&fit=crop&w=1800&q=72"
           alt="A quiet coastal terrace at dusk" loading="lazy" decoding="async">
    </div>
    <div class="feature__veil" aria-hidden="true"></div>
    <div class="shell feature__inner">
      <div class="shell--narrow" style="padding:0">
        <span class="eyebrow eyebrow-rule eyebrow--on-dark">Error 404</span>
        <h1 class="hero__title" data-split>Off the map</h1>
        <p class="lead lead--on-dark">That address does not lead anywhere — the page has moved,
          or it never existed. The collection is still here, and so is the booking desk.</p>

        <form class="searchpanel" role="search" data-404-search novalidate
              style="margin-top:var(--sp-6);background:transparent;border:0;padding:0">
          <div class="searchpanel__grid">
            <div class="field">
              <label class="field__label" for="nf-q">Search hotels, resorts or cities</label>
              <input class="input" id="nf-q" name="q" type="search"
                     placeholder="Kyoto, Mactan, Aether…" data-nf-q>
            </div>
          </div>
        </form>

        <div class="cluster" style="margin-top:var(--sp-6)">
          <a class="btn btn--gold btn--lg" data-magnetic href="/hotels">Browse all hotels</a>
          <a class="btn btn--ghost btn--lg" href="/book">Find &amp; Book</a>
          <a class="btn btn--ghost btn--lg" href="/">Back to the home page</a>
        </div>

        <p class="muted" style="color:var(--text-invert-mute);margin-top:var(--sp-6);max-width:34rem">
          Or call reservations on
          <a href="tel:+639615625020">09615625020</a>,
          Monday to Sunday.
        </p>
      </div>
    </div>
  </section>

</main>

<div data-footer-mount></div>
<div data-chat-mount></div>

<script type="module" src="/assets/js/app.js"></script>
<script type="module">
  // Keep the 404 search inside the site: hand the term to the hotels page,
  // which owns the real filtering. A form with no action would reload this
  // page and lose the guest's typing.
  const form = document.querySelector("[data-404-search]");
  const input = document.querySelector("[data-nf-q]");
  if (form && input) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = input.value.trim();
      window.location.href = q ? `/hotels?q=${encodeURIComponent(q)}#destinations` : "/hotels";
    });
  }
</script>
</body>
</html>
